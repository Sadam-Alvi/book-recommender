<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Recommender</title>

    <link rel="stylesheet"
          href="{{ url_for('static', path='style.css') }}">
</head>

<body>

<div class="preference-page">

    <h1>Find Your Next Book</h1>

    <!-- <p>Tell us what you like and we'll find books for you.</p> -->

   <form action="/results" method="get" class="preference-form">

    <h1>Find Your Next Book</h1>
    <p class="subtitle">Choose your preferences and we'll find books you'll love.</p>

    <!-- Genres -->
    <div class="field">
        <label>Genres</label>
        <p class="hint">Choose up to 3</p>

        <div class="genre-grid">
            {% for genre in top_20_genres %}
            <label class="genre-option">
                <input
                    type="checkbox"
                    name="selected_genres"
                    value="{{ genre }}"
                    {% if genre in selected_genres %}checked{% endif %}
                >
                <span>{{ genre }}</span>
            </label>
            {% endfor %}
        </div>
    </div>


    <!-- Author -->
    <div class="field">
        <label for="author">Author</label>
        <p class="hint">Start typing to find an author</p>

        <input
            type="text"
            id="author"
            name="author"
            list="author-list"
            placeholder="Search author..."
            autocomplete="off"
            value="{{ author }}"
        >

        <datalist id="author-list">
            {% for author_name in all_authors %}
                <option value="{{ author_name }}">
            {% endfor %}
        </datalist>
    </div>


    <!-- Year -->
    <div class="field">
        <label for="year">Publication Year</label>

        <select name="year" id="year">
            <option value="">Any year</option>

            {% for y in years %}
                <option
                    value="{{ y }}"
                    {% if year == y %}selected{% endif %}
                >
                    {{ y }}
                </option>
            {% endfor %}
        </select>
    </div>


    <button type="submit" class="find-button">
        Find Books →
    </button>

</form>

</div>

</body>
</html>
